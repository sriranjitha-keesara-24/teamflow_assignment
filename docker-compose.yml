version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: teamflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - teamflow-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: teamflow-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/teamflow
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=supersecretjwtkey123!
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - teamflow-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: teamflow-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - server
    networks:
      - teamflow-network

volumes:
  mongodb_data:

networks:
  teamflow-network:
    driver: bridge
